[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwg2c4d"
version = "0.6.0"
description = "Trasforma una planimetria 2D (DWG/DXF) in un modello 3D OBJ pronto per Cinema 4D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.1",
    "shapely>=2.1",
    "numpy>=1.23",
    "matplotlib>=3.5",  # only for the plan check picture; the rest works without it
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dwg2c4d = "dwg2c4d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dwg2c4d = ["data/*.npz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
