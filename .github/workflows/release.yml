# Pubblica una release con lo ZIP "NOMEREPO-VERSIONE.zip" (cartella interna con lo stesso nome) ogni volta che la
# versione in pyproject.toml cambia (o a mano da Actions -> Release -> Run workflow). Se la versione ha gia' il suo tag
# non fa nulla. Le note sono la sezione della versione in CHANGELOG.md.
name: Release

on:
  push:
    branches: ["claude/dwg-to-3d-cinema4d-0c0if5"]
    paths: ["pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versione e nome
        id: v
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${{ github.event.repository.name }}-$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - name: Note dal CHANGELOG
        if: steps.v.outputs.exists != 'true'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "dwg2c4d ${{ steps.v.outputs.version }}" > notes.md

      - name: ZIP e release
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git archive --format=zip --prefix="${{ steps.v.outputs.name }}/" -o "${{ steps.v.outputs.name }}.zip" HEAD
          gh release create "v${{ steps.v.outputs.version }}" "${{ steps.v.outputs.name }}.zip" \
            --target "$GITHUB_SHA" --title "dwg2c4d ${{ steps.v.outputs.version }}" --notes-file notes.md
